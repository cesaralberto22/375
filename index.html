<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jornada 37,5 horas Principado de Asturias</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial, sans-serif; background: #0b1220; color: #e2e8f0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .card { background: #0f172a; border: 1px solid #1f2937; border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { font-size: 20px; font-weight: 800; color: #e2e8f0; }
    input, button { padding: 9px 12px; border-radius: 10px; border: 1px solid #1f2937; background: #0b1220; color: #e2e8f0; font-weight: 600; margin-top: 10px; }
    button { background: #0ea5e9; color: white; border: 1px solid #0b83b7; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>Jornada 37,5 horas Principado de Asturias</h1>
        <div>
          <input id="email" type="email" placeholder="tu@correo.com" />
          <button id="btn-login-link">Acceso por enlace</button>
        </div>
      </header>

      <div id="auth-msg"></div>

      <div id="work-form" style="display:none;">
        <div>
          <label>Entrada: <input id="entrada" type="time" /></label>
        </div>
        <div>
          <label>Salida: <input id="salida" type="time" /></label>
        </div>
        <button id="guardar">Guardar horas</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script>
    const SUPABASE_URL = "https://izkwmbtyzvdiwfvenzbb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6a3dtYnR5enZkaXdmdmVuemJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyMzU1ODEsImV4cCI6MjA3NzgxMTU4MX0.jrJNclTJO3uy5WP6q5i01aQbiryQuTWGE1KIUyowAhw";
    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const msg = (text) => {
      document.getElementById("auth-msg").textContent = text;
    };

    document.getElementById("btn-login-link").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) return msg("Por favor, ingresa tu email.");

      msg("Enviando enlace...");

      const { error } = await supa.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: window.location.origin,
        },
      });

      if (error) {
        msg("Error: " + error.message);
      } else {
        msg("Te envié un enlace. Ábrelo en este navegador.");
      }
    };

    document.getElementById("guardar").onclick = async () => {
      const entrada = document.getElementById("entrada").value;
      const salida = document.getElementById("salida").value;

      if (!entrada || !salida) {
        return msg("Por favor, ingresa las horas de entrada y salida.");
      }

      const { data: { user } } = await supa.auth.getUser();

      if (!user) {
        return msg("Debes iniciar sesión primero.");
      }

      const horasTrabajadas = (parseTime(salida) - parseTime(entrada)) / 60;
      msg(`Horas trabajadas: ${horasTrabajadas} horas`);

      const fecha = new Date().toISOString().split("T")[0]; // Fecha actual en formato YYYY-MM-DD

      const { error } = await supa.from("work_days").upsert({
        user_id: user.id,
        work_date: fecha,
        entrada,
        salida,
        hours_worked: horasTrabajadas,
      });

      if (error) {
        msg("Error al guardar las horas: " + error.message);
      } else {
        msg("Horas guardadas correctamente.");
      }
    };

    supa.auth.onAuthStateChange(() => refreshAuthUI());

    async function refreshAuthUI() {
      const { data: { user } } = await supa.auth.getUser();
      if (user) {
        msg("Sesión iniciada como: " + user.email);
        document.getElementById("work-form").style.display = "block"; // Mostrar formulario de horas
      } else {
        msg("No has iniciado sesión.");
        document.getElementById("work-form").style.display = "none"; // Ocultar formulario de horas
      }
    }

    function parseTime(time) {
      const [hours, minutes] = time.split(":").map(Number);
      return hours * 60 + minutes;
    }
  </script>
</body>
</html>
