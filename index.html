<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Jornada 37,5 h - Principado de Asturias - DGDIA</title>
  <style>
    :root{--bg:#0b1220;--card:#0f172a;--muted:#94a3b8;--fg:#e2e8f0;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--fg)}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    .card{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:18px}
    h1{margin:0;font-size:20px;font-weight:800}
    select,input[type=time],button{padding:8px;border-radius:8px;border:1px solid #1f2937;background:#0b1220;color:var(--fg)}
    .grid{display:grid;grid-template-columns:240px 1fr 1fr 140px 180px;gap:8px;align-items:center}
    .row:nth-child(even){background:rgba(148,163,184,.06)}
    .totdia{font-weight:700}
  </style>
</head>

<body>
<div class="wrap">
<div class="card">
<h1>Registro de Jornada 37,5 h - Principado de Asturias - DGDIA</h1>

<div class="grid">
  <div>Día</div><div>Entrada</div><div>Salida</div><div>Total día</div><div>Tipo</div>
</div>
<div id="rows"></div>

</div>
</div>

<script>
(function(){
'use strict';

/* ===================== CONFIG ===================== */
const TARGET_MIN = 37.5 * 60;
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes"];
const WORK_START = 7*60+30;
const WORK_END   = 19*60;
const STORAGE_KEY='horas375_by_date_v2';

/* ===================== HELPERS ===================== */
const pad=n=>String(n).padStart(2,'0');
const fmtHM=m=>`${Math.floor(m/60)} h ${pad(m%60)}`;
const parseTime=s=>s?((+s.split(':')[0])*60+(+s.split(':')[1])):null;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const getMonday=d=>{
  const x=new Date(d);
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  x.setHours(0,0,0,0);
  return x;
};

function overlapMins(start,end){
  if(start==null||end==null)return 0;
  if(end<start)end+=1440;
  return Math.max(0,Math.min(end,WORK_END)-Math.max(start,WORK_START));
}

const loadLocal=()=>JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
const saveLocal=db=>localStorage.setItem(STORAGE_KEY,JSON.stringify(db));

/* ===================== PRECARGA 2026 ===================== */
function preload2026IfNeeded(){
  const FLAG='preload_2026_done';
  if(localStorage.getItem(FLAG))return;

  const db=loadLocal();
  const year=2026;
  const weekdays=[];
  let d=new Date(year,0,1);

  while(d.getFullYear()===year){
    if(d.getDay()>=1 && d.getDay()<=5){
      weekdays.push(new Date(d));
    }
    d=addDays(d,1);
  }

  function assign(count,kind){
    let used=0;
    for(const day of weekdays){
      if(used>=count)break;
      const key=fmtDate(day);
      if(!db[key]){
        db[key]={e:'',s:'',k:kind};
        used++;
      }
    }
  }

  assign(22,'VA');
  assign(6,'AP');
  assign(1,'DC');

  saveLocal(db);
  localStorage.setItem(FLAG,'1');
}

/* ===================== UI ===================== */
const rowsEl=document.getElementById('rows');
let state=[];

function makeKindSelect(){
  const s=document.createElement('select');
  s.innerHTML=`
    <option value="">— (TR)</option>
    <option value="VA">VA</option>
    <option value="AP">AP</option>
    <option value="OP">OP</option>
    <option value="DC">DC</option>
  `;
  return s;
}

function saveDay(r){
  const db=loadLocal();
  db[r.date]={e:r.e||'',s:r.s||'',k:r.k||null};
  saveLocal(db);
}

function rebuild(){
  rowsEl.innerHTML='';
  state.forEach(r=>{
    const row=document.createElement('div');
    row.className='grid row';

    const d=document.createElement('div'); d.textContent=r.dia;
    const ei=document.createElement('input'); ei.type='time'; ei.value=r.e||'';
    const eo=document.createElement('input'); eo.type='time'; eo.value=r.s||'';
    const t=document.createElement('div'); t.className='totdia';
    const ks=makeKindSelect(); ks.value=r.k||'';

    function recalc(){
      let mins=0;
      if(['VA','AP','OP','DC'].includes(r.k)){
        mins=450;
      }else{
        mins=overlapMins(parseTime(r.e),parseTime(r.s));
      }
      t.textContent=mins?fmtHM(mins):'—';
      saveDay(r);
    }

    ei.oninput=()=>{r.e=ei.value;r.k=null;ks.value='';recalc()};
    eo.oninput=()=>{r.s=eo.value;r.k=null;ks.value='';recalc()};
    ks.onchange=()=>{
      r.k=ks.value||null;
      r.e='';r.s='';
      ei.value='';eo.value='';
      recalc();
    };

    recalc();
    row.append(d,ei,eo,t,ks);
    rowsEl.appendChild(row);
  });
}

/* ===================== INIT ===================== */
document.addEventListener('DOMContentLoaded',()=>{
  preload2026IfNeeded();

  const monday=getMonday(new Date());
  const db=loadLocal();
  state=[];

  for(let i=0;i<5;i++){
    const d=addDays(monday,i);
    const key=fmtDate(d);
    const rec=db[key]||{};
    state.push({
      dia:DIAS[i],
      date:key,
      e:rec.e||'',
      s:rec.s||'',
      k:rec.k||null
    });
  }

  rebuild();
});

})();
</script>
</body>
</html>
