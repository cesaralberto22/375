<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horas 37,5 · Semanas</title>
  <style>
    :root{--bg:#0b1220;--card:#0f172a;--muted:#94a3b8;--fg:#e2e8f0;--acc:#0ea5e9;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:#0b1220;color:var(--fg)}
    .wrap{max-width:1000px;margin:0 auto;padding:20px}
    .card{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    h1{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
    .sub{color:var(--muted);font-size:13px;margin-top:6px}
    header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .flag{width:28px;height:20px;border-radius:3px;display:inline-block}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    select,button,input[type=email]{padding:9px 12px;border-radius:10px;border:1px solid #1f2937;background:#0b1220;color:var(--fg);font-weight:600}
    button.primary{background:linear-gradient(180deg,#0ea5e9,#0284c7);color:white;border:1px solid #0b83b7}
    .grid{display:grid;grid-template-columns:140px 1fr 1fr 160px;gap:8px;align-items:center;margin-top:10px}
    .head{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
    .row{padding:8px;border-radius:12px}
    .row:nth-child(even){background:rgba(148,163,184,.06)}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type=time]{width:100%;padding:10px 12px;border:1px solid #1f2937;border-radius:10px;background:#0b1220;color:var(--fg)}
    .totdia{font-weight:700}
    .totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
    .kpi{background:rgba(148,163,184,.06);border:1px solid #1f2937;border-radius:14px;padding:14px}
    .kpi .lbl{font-size:12px;color:var(--muted)}
    .kpi .val{font-size:18px;font-weight:800;margin-top:6px}
    .kpi.ok .val{color:var(--ok)}.kpi.warn .val{color:var(--warn)}.kpi.err .val{color:var(--err)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
    .msg{font-size:12px;margin-top:6px}
    .msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.warn{color:var(--warn)} .msg.info{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div>
          <h1>
            <span class="flag">
              <svg viewBox="0 0 160 110" width="28" height="20" style="display:block;border-radius:3px">
                <rect width="160" height="110" fill="#1f8dd6"/>
                <g fill="#ffd700">
                  <rect x="72" y="20" width="16" height="70"/>
                  <rect x="35" y="54" width="90" height="15"/>
                  <circle cx="80" cy="20" r="6"/>
                </g>
              </svg>
            </span>
            Horas 37,5 · Semanas
          </h1>
          <div class="sub">L–V. Solo cuenta 07:30–19:00. Guardado por usuario y semana ISO.</div>
        </div>

        <!-- LOGIN -->
        <div id="auth" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px">
          <input id="email" type="email" placeholder="tu@correo.com" />
          <button id="btn-login" class="primary">Entrar (link)</button>
          <button id="btn-logout" style="display:none;">Salir</button>
          <span id="whoami" style="color:#94a3b8;"></span>
          <div id="auth-msg" class="msg info"></div>
        </div>
      </header>

      <div class="grid head"><div>Día</div><div>Entrada</div><div>Salida</div><div>Total día</div></div>
      <div id="rows"></div>

      <div class="totals">
        <div class="kpi" id="kpi-total">
          <div class="lbl">Total semana</div>
          <div class="val" id="total-semana">0 h 00 m</div>
        </div>
        <div class="kpi">
          <div class="lbl">Objetivo</div>
          <div class="val">37,5 h</div>
        </div>
        <div class="kpi" id="kpi-faltan">
          <div class="lbl">Faltan / Exceso</div>
          <div class="val" id="faltan">37 h 30 m</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL  = "https://izkwmbtyzvdiwfvenzbb.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6a3dtYnR5enZkaXdmdmVuemJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyMzU1ODEsImV4cCI6MjA3NzgxMTU4MX0.jrJNclTJO3uy5WP6q5i01aQbiryQuTWGE1KIUyowAhw";
    const REDIRECT_URL  = window.location.origin;

    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const authMsg = document.getElementById('auth-msg');
    function setMsg(text, type='info'){ authMsg.textContent = text; authMsg.className = `msg ${type}`; }

    const TARGET_MIN = Math.round(37.5 * 60);
    const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes"];
    const WORK_START = 7*60 + 30;  
    const WORK_END   = 19*60;      

    const rowsEl = document.getElementById('rows');
    const who = document.getElementById('whoami');
    const email = document.getElementById('email');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');

    const pad = n => String(n).padStart(2,'0');
    const fmtHM = m => { const sign = m<0?'-':''; m=Math.abs(m); const h=Math.floor(m/60), mm=m%60; return `${sign}${h} h ${pad(mm)}`; };
    const parseTime = s => { if (!s) return null; const [hh,mm]=s.split(':').map(Number); return hh*60+mm; };
    const overlapMins = (start, end, winStart=WORK_START, winEnd=WORK_END) => {
      if (start==null || end==null) return null;
      if (end < start) end += 24*60;
      const a = Math.max(start, winStart);
      const b = Math.min(end, winEnd);
      return Math.max(0, b - a);
    };

    const state = DIAS.map(d => ({ dia:d, e:'', s:'', total:0 }));
    const ui = [];

    function makeRow(i){
      const r = state[i];
      const row = document.createElement('div'); row.className='grid row';
      const d = document.createElement('div'); d.textContent = r.dia;
      const eIn = document.createElement('input'); eIn.type='time'; eIn.value=r.e;
      const eOut= document.createElement('input'); eOut.type='time'; eOut.value=r.s;
      const td  = document.createElement('div'); td.className='totdia'; td.textContent='—';
      eIn.addEventListener('input', ()=>{ r.e=eIn.value; recalc(); });
      eOut.addEventListener('input', ()=>{ r.s=eOut.value; recalc(); });
      row.appendChild(d); row.appendChild(eIn); row.appendChild(eOut); row.appendChild(td);
      rowsEl.appendChild(row); ui[i] = { td, eIn, eOut };
    }

    function recalc(){
      let sum=0;
      for (let i=0;i<state.length;i++){
        const mins=overlapMins(parseTime(state[i].e), parseTime(state[i].s));
        if(mins==null){ state[i].total=0; ui[i].td.textContent='—'; }
        else { state[i].total=mins; ui[i].td.textContent=fmtHM(mins); sum+=mins; }
      }
      document.getElementById('total-semana').textContent = fmtHM(sum);
      document.getElementById('faltan').textContent = fmtHM(TARGET_MIN - sum);
    }

    function buildRows(){ rowsEl.innerHTML=''; for(let i=0;i<DIAS.length;i++) makeRow(i); }

    // === LOGIN ===
    async function handleAuthRedirect(){
      const href = window.location.href;
      const hasCode = href.includes('code=') || href.includes('access_token=');
      if (hasCode){
        const { error } = await supa.auth.exchangeCodeForSession(href);
        if (error) setMsg('Error de inicio: ' + error.message, 'err');
        window.history.replaceState({}, document.title, window.location.origin);
      }
    }

    async function refreshAuthUI(){
      const { data:{ user } } = await supa.auth.getUser();
      if (user){
        who.textContent = `Sesión: ${user.email}`;
        btnLogin.style.display='none'; email.style.display='none'; btnLogout.style.display='inline-block';
        setMsg('Sesión iniciada', 'ok');
      } else {
        who.textContent = 'Sin sesión';
        btnLogin.style.display='inline-block'; email.style.display='inline-block'; btnLogout.style.display='none';
        setMsg('No has iniciado sesión', 'info');
      }
    }

    btnLogin.addEventListener('click', async ()=>{
      const raw = (email.value || '').trim();
      if (!raw){ setMsg('Pon tu email', 'warn'); return; }

      setMsg('Enviando enlace...', 'info');
      const { error } = await supa.auth.signInWithOtp({
        email: raw,
        options: { emailRedirectTo: window.location.origin }
      });
      if (error) setMsg('Error enviando enlace: ' + error.message, 'err');
      else setMsg('Enlace enviado. Ábrelo desde este mismo navegador.', 'ok');
    });

    btnLogout.addEventListener('click', async ()=>{
      await supa.auth.signOut();
      setMsg('Sesión cerrada', 'info');
      refreshAuthUI();
    });

    supa.auth.onAuthStateChange((_evt,_session)=>{ refreshAuthUI(); });

    document.addEventListener('DOMContentLoaded', async ()=>{
      buildRows();
      recalc();
      await handleAuthRedirect();
      await refreshAuthUI();
    });
  </script>
</body>
</html>
